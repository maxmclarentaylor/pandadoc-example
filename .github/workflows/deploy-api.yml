name: Deploy API

on:
  # Runs after a push to dev (and on manual dispatch).
  push:
    branches: [dev]
    paths:
      - "apps/api/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_API_WEBAPP_NAME }}
          package: apps/api

      # Run on App Service (VNet + PE + Key Vault refs). GitHub runners cannot reach private Postgres.
      - name: Run Alembic migrations
        env:
          APP_NAME: ${{ vars.AZURE_API_WEBAPP_NAME }}
          RESOURCE_GROUP: segment-practice-dev-rg
        working-directory: .
        run: |
          set -euo pipefail
          USER=$(az webapp deployment list-publishing-credentials \
            -g "$RESOURCE_GROUP" -n "$APP_NAME" \
            --query publishingUserName -o tsv)
          PASS=$(az webapp deployment list-publishing-credentials \
            -g "$RESOURCE_GROUP" -n "$APP_NAME" \
            --query publishingPassword -o tsv)

          RESP=$(curl -sS -X POST \
            "https://${APP_NAME}.scm.azurewebsites.net/api/command" \
            -u "${USER}:${PASS}" \
            -H "Content-Type: application/json" \
            -d '{"command":"python -m alembic upgrade head","dir":"/home/site/wwwroot"}')

          echo "$RESP"
          EXIT=$(echo "$RESP" | python3 -c "import sys, json; print(json.load(sys.stdin).get('ExitCode', 1))")
          test "$EXIT" = "0"
